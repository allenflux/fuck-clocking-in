services:
  attendance:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      ATTENDANCE_STATE_PATH: /app/data/state.sqlite3
    volumes:
      - attendance-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  attendance-data:
